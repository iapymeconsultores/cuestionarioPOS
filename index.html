<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADN de tu marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&family=Manrope:wght@400;600;800&family=DM+Serif+Display&family=Work+Sans:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,400;800&family=Josefin+Sans:wght@300;400;600&family=Anton&family=Archivo:wght@400;600&family=Syne:wght@600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=block">
<style>
/* Layout: cuestionario a la izquierda, vista previa viva de la tienda a la derecha (debajo en móvil). Barra de navegación fija abajo. */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --line:#DCDCD8; --fg:#1A1B1E; --muted:#5E6066;
  --accent:#2E45D1; --accent-soft:#E6E9FB; --sel:#1A1B1E; --sel-fg:#FFFFFF;
  --ui:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Unbounded", "Onest", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131416; --surface:#1C1D20; --line:#303237; --fg:#ECECEA; --muted:#A3A5AB;
  --accent:#8E9BFF; --accent-soft:#252A4A; --sel:#ECECEA; --sel-fg:#131416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1C1D20; --line:#303237; --fg:#ECECEA; --muted:#A3A5AB;
  --accent:#8E9BFF; --accent-soft:#252A4A; --sel:#ECECEA; --sel-fg:#131416; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ms-icon,.mi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";-webkit-font-smoothing:antialiased}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;height:60px}
.brand{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.01em}
.prog{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.prog-bar{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden;max-width:360px}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s cubic-bezier(.16,1,.3,1)}
.prog-txt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg)}

.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;
  padding-block:32px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.full{grid-template-columns:minmax(0,1fr)}
.q{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,36px);line-height:1.15;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.3;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);font-size:16px;max-width:60ch;margin:0 0 28px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:60ch}
.block{margin-bottom:40px}
.opt-tag{display:inline-block;font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;font-family:var(--ui)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;max-width:480px}
.field label{font-weight:500;font-size:14px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.inp::placeholder{color:var(--muted);opacity:.8}
textarea.inp{min-height:96px;resize:vertical;max-width:640px}

/* tiles */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;
  display:flex;flex-direction:column;gap:10px;transition:border-color .2s, transform .15s;min-width:0}
.tile:hover{border-color:var(--muted)}
.tile:active{transform:scale(.985)}
.tile[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 1.5px var(--sel)}
.tile[aria-pressed="true"]::after{content:"check";font-family:"Material Symbols Outlined";position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
  background:var(--sel);color:var(--sel-fg);font-size:16px;display:grid;place-items:center;z-index:2}
.tile .t-name{font-weight:600;font-size:14px;line-height:1.3}
.tile .t-desc{font-size:13px;color:var(--muted);line-height:1.4}
.tile.icon{align-items:flex-start;padding:16px}
.tile.icon .mi{font-size:26px}
.tile.help{border-style:dashed;justify-content:center;align-items:center;text-align:center;color:var(--muted)}
.tile.help[aria-pressed="true"]{color:var(--fg)}
.badge{align-self:flex-start;font-size:11.5px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.chip .mi{font-size:16px}
.chip.small{padding:5px 10px;font-size:13px}

.price{font-family:var(--display);font-size:22px;letter-spacing:.06em}

/* sliders */
.sl{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.sl:last-of-type{border-bottom:0}
.sl span{font-size:14px;font-weight:500}
.sl span:last-child{text-align:right}
.sl span.on{color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--sel);height:28px}

/* moods */
.mood-art{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr;gap:4px;aspect-ratio:4/3;border-radius:10px;overflow:hidden}
.mood-art > div{position:relative;overflow:hidden}
.mood-art .big{grid-row:span 2;display:grid;place-items:center}
.mood-art .shape{width:56%;aspect-ratio:1}
.shape.arch{border-radius:999px 999px 0 0;aspect-ratio:3/4}
.shape.circle{border-radius:50%}
.shape.rect{aspect-ratio:3/4;width:46%}
.shape.blob{border-radius:62% 38% 55% 45% / 48% 60% 40% 52%}
.shape.diamond{transform:rotate(45deg);width:42%}
.shape.square{width:26%}
.shape.ring{border-radius:50%;background:transparent!important;border:3px solid currentColor}
.mood-art .word{display:grid;place-items:center;font-size:28px}

/* palettes */
.pal{display:flex;height:64px;border-radius:10px;overflow:hidden}
.pal i{flex:1}
.pal i:first-child{flex:1.6}
.pal-mini{display:flex;flex-direction:column;gap:6px}
.hexes{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.own{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.own label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.own input[type=color]{width:84px;height:56px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

/* fonts */
.font-card{padding:18px}
.fc-name{font-size:30px;line-height:1.1;overflow-wrap:anywhere}
.fc-body{font-size:14px;color:var(--muted)}

/* refs */
.refrows{display:flex;flex-direction:column;gap:14px;margin-bottom:14px;max-width:720px}
.refrow{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.refrow.ok{border-color:var(--sel)}
.refrow-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.refnum{font-family:var(--display);font-weight:500;font-size:14px}
.refrow label{font-size:13px;font-weight:500;margin-top:6px}
.refrow textarea.inp{min-height:72px}
.refcount{font-size:14px;font-weight:500;margin:4px 0 0}
.refcount.ok{color:var(--fg)}
.refcount.no{color:var(--accent)}
.ref .ms{font-size:4.2px}
.ref-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ref-link{font-size:13px;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.ref-link:hover{text-decoration:underline}
.likes{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ref-wrap{display:flex;flex-direction:column;gap:8px;min-width:0}

/* mini web mockup */
.ms{--b:#fff;--s:#eee;--f:#111;--a:#111;--a2:#999;--fd:sans-serif;--fb:sans-serif;--r:0em;--tt:none;--ls:0;--fw:700;
  background:var(--b);color:var(--f);font-family:var(--fb);font-size:5.4px;line-height:1.3;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.08);
  pointer-events:none;user-select:none}
.ms-nav{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:1.4em 2em}
.ms-logo{font-family:var(--fd);font-size:2em;font-weight:var(--fw);text-transform:var(--tt);letter-spacing:var(--ls);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.ms-links{display:flex;gap:1.2em}
.ms-links i{display:block;width:3.4em;height:.55em;background:currentColor;opacity:.35;border-radius:1em}
.ms-nav .mi{font-size:2.4em}
.ms-h{font-family:var(--fd);font-weight:var(--fw);text-transform:var(--tt);letter-spacing:var(--ls);font-size:3.4em;line-height:1.02;margin:0}
.ms-btn{display:inline-block;background:var(--a);color:var(--b);padding:.7em 1.8em;font-size:1.2em;border-radius:var(--r);font-weight:600;margin-top:1em}
.ms-ph{border-radius:var(--r);background:var(--s)}
.ms-hero{position:relative}
.ms-hero.full{height:26em;margin:0 2em;display:flex;align-items:flex-end;padding:2.4em}
.ms-hero.full .ms-h,.ms-hero.video .ms-h{color:#fff;text-shadow:0 .1em .6em rgba(0,0,0,.25)}
.ms-hero.split{display:grid;grid-template-columns:1fr 1.1fr;gap:2em;padding:0 2em;align-items:center}
.ms-hero.split .ms-ph{height:24em}
.ms-lines{display:flex;flex-direction:column;gap:.6em;margin-top:1.2em}
.ms-lines i{display:block;height:.55em;background:currentColor;opacity:.25;border-radius:1em}
.ms-hero.video{height:26em;margin:0 2em;display:grid;place-items:center}
.ms-play{width:6em;height:6em;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#111}
.ms-play .mi{font-size:3.6em}
.ms-hero.video .ms-h{position:absolute;left:1.2em;bottom:.8em;font-size:2.6em}
.ms-hero.carrusel{padding:0 2em}
.ms-hero.carrusel .row{display:flex;gap:1em;margin-top:1.2em;overflow:hidden}
.ms-hero.carrusel .row .ms-ph{flex:0 0 22%;height:14em}
.ms-hero.letras{padding:2em 2em 1em}
.ms-hero.letras .ms-h{font-size:7.4em;line-height:.95;overflow-wrap:anywhere}
.ms-hero.letras .strip{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1em;margin-top:1.6em}
.ms-hero.letras .strip .ms-ph{height:8em}
.ms-entry{display:grid;grid-template-columns:1fr 1fr;gap:1em;margin:0 2em 1.6em}
.ms-entry > div{height:12em;display:flex;align-items:flex-end;padding:1.2em}
.ms-entry b{font-family:var(--fd);font-size:2em;color:#fff;text-transform:var(--tt);letter-spacing:var(--ls);text-shadow:0 .1em .5em rgba(0,0,0,.3)}
.ms-sec{font-family:var(--fd);font-size:1.8em;font-weight:var(--fw);text-transform:var(--tt);letter-spacing:var(--ls);padding:2em 1.1em .8em}
.ms-grid{display:grid;gap:1.2em;padding:0 2em 2.4em}
.ms-card .ms-ph{aspect-ratio:3/4}
.ms-card .ms-lines{margin-top:.8em;gap:.5em}
.ms-card .ms-lines i:last-child{width:40%;opacity:.5}
.ms-foot{background:var(--f);height:4em;opacity:.9}

/* pdp art */
.pdp{background:var(--b);color:var(--f);border-radius:8px;border:1px solid rgba(0,0,0,.08);padding:10px;aspect-ratio:4/3;display:grid;gap:6px;font-size:5px}
.pdp .ms-ph{border-radius:var(--r)}
.pdp.galeria{grid-template-columns:1.4fr 1fr}
.pdp.galeria .ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pdp.vertical{grid-template-columns:1.6fr 1fr}
.pdp.vertical .ph-col{display:grid;gap:4px;overflow:hidden;grid-template-rows:1fr 1fr .6fr}
.pdp.miniaturas{grid-template-columns:.25fr 1.4fr 1fr}
.pdp.miniaturas .thumbs{display:grid;gap:4px;grid-template-rows:repeat(4,1fr)}
.pdp .info{display:flex;flex-direction:column;gap:5px;padding-top:4px}
.pdp .info i{display:block;height:4px;background:currentColor;opacity:.25;border-radius:4px}
.pdp .info b{display:block;height:7px;width:80%;background:currentColor;opacity:.75;border-radius:4px}
.pdp .info .btn{height:10px;background:var(--a);border-radius:var(--r);margin-top:6px;opacity:1}
.pdp .sizes{display:flex;gap:3px}
.pdp .sizes span{flex:1;height:7px;border:1px solid currentColor;opacity:.35;border-radius:2px}

/* preview */
.pv{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:10px}
.pv-h{font-family:var(--display);font-weight:500;font-size:14px;margin:0}
.pv-note{font-size:12.5px;color:var(--muted);margin:0}
.pv .ms{font-size:7.2px;box-shadow:0 18px 40px -24px rgba(20,22,30,.35)}
.btn.pv-toggle{display:none}

/* summary */
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:0;letter-spacing:.04em;text-transform:uppercase}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}
.axis{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.axis .line{position:relative;height:1px;background:var(--line)}
.axis .dot{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--fg)}
.sum-pal{display:flex;height:72px;border-radius:10px;overflow:hidden}
.sum-pal i{flex:1}
.quote{font-size:15px;line-height:1.55;margin:0;max-width:60ch}
.miss{border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin-bottom:24px}
.miss p{margin:0 0 8px;font-weight:600}
.miss .chips .chip{background:var(--surface)}
.send{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:28px}
.status{font-size:14px;margin-top:12px;max-width:60ch}
.status.ok{color:var(--fg)}
.copybox{width:100%;min-height:200px;margin-top:12px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.dim{color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 22px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.btn .mi{font-size:20px}
.btn[disabled]{opacity:.45;cursor:default}
.ghost{border:0;background:none;color:var(--muted);font-size:14px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}

/* intro */
.intro{max-width:720px;padding-top:4vh}
.intro-art{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:28px 0}
.intro-art div{aspect-ratio:3/4;border-radius:10px}
.intro ul{padding-left:20px;margin:0 0 28px;color:var(--muted)}
.intro li{margin-bottom:6px}

@media (max-width:1020px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .pv{position:static;order:-1;display:none}
  .pv.open{display:flex}
  .btn.pv-toggle{display:inline-flex;margin-bottom:18px}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c2,.c3,.c4,.c6{grid-column:span 2}
}
@media (max-width:600px){
  .g3,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2.stack{grid-template-columns:minmax(0,1fr)}
  .sl{grid-template-columns:1fr 1fr;row-gap:2px}
  .sl input{grid-column:1/-1;grid-row:2}
  .prog-bar{display:none}
  .fc-name{font-size:24px}
  .btn{padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span class="brand">IApyme</span>
  <div class="prog"><div class="prog-bar"><i id="progBar"></i></div><span class="prog-txt" id="progTxt"></span></div>
  <div class="lang" role="group" aria-label="Idioma">
    <button id="lang-es" data-act="lang" data-val="es">ES</button>
    <button id="lang-uk" data-act="lang" data-val="uk">УКР</button>
  </div>
</div></header>

<main class="wrap" id="wrap">
  <section class="q" id="q"></section>
  <aside class="pv" id="pv"></aside>
</main>

<nav class="nav" id="nav"><div class="nav-in" id="navIn"></div></nav>

<script>
(function(){
"use strict";
const KEY = "adn-marca-v1";

/* ---------- datos ---------- */
const PALETTES = [
 {id:"bn",      es:"Blanco y negro",     uk:"Чорне і біле",        c:["#FFFFFF","#E6E6E3","#141414","#141414","#8A8A86"]},

function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  const base = JSON.parse(JSON.stringify(DEFAULTS));
  if(s && typeof s === "object"){ for(const k in base){ if(k in s) base[k] = s[k]; } }
  if(!Array.isArray(base.refs)) base.refs = JSON.parse(JSON.stringify(DEFAULTS.refs));
  while(base.refs.length < 2) base.refs.push({url:"",gusta:"",likes:[]});
  return base;
}

function currentPalette(){
  if(S.colorModo === "propios"){ const [p,a,b] = S.propios; return [b, mix(b,a,.35), readable(b), p, a]; }
  const p = byId(PALETTES, S.paleta);
  if(p && S.colorModo === "paleta") return p.c;
  const m = byId(MOODS, S.ambientes[0]);
  if(m) return byId(PALETTES, m.pals[0]).c;
  return ["#FFFFFF","#E4E4E1","#1A1A1A","#1A1A1A","#9A9A96"];
}
function hex2rgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(x=>x+x).join(""); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function mix(a,b,t){ const A=hex2rgb(a),B=hex2rgb(b); return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
function lum(h){ const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b; }
function readable(bg){ return lum(bg) > .35 ? "#161616" : "#F4F2EE"; }
function currentFont(){ return byId(FONTS, S.letra) || FONTS[1]; }
function previewCfg(over){
  const c = currentPalette();
  return Object.assign({bg:c[0], s:c[1], f:c[2], a:c[3], a2:c[4], font:(byId(FONTS,S.letra)||FONTS[1]).id,
    hero: (S.hero && S.hero!==HELP) ? S.hero : "full", grid: (S.rejilla && S.rejilla!==HELP) ? +S.rejilla : 3,
    entry: S.entrada === "elegir" ? "elegir" : "directo", name: S.tienda.trim() || L("Tu tienda","Ваш магазин"),
    cats: S.categorias.length >= 2 ? S.categorias.slice(0,2) : (S.sector.length>=2 ? S.sector.slice(0,2).map(id=>byId(SECTORS,id)?.es||id) : ["Mujer","Hombre"]),
    r: S.ambientes.includes("pop") ? .8 : 0}, over || {});
}

/* ---------- maqueta de web ---------- */
function ph(c, i){
  const t = [ [c.s, c.a2], [c.a2, c.s], [mix(c.s,c.f,.12), c.s], [c.s, mix(c.a,c.s,.6)] ][i % 4];
  return `background:linear-gradient(${150 + i*25}deg, ${t[0]}, ${t[1]})`;
}
function miniSite(c){
  const F = byId(FONTS, c.font) || FONTS[1];
  const vars = `--b:${c.bg};--s:${c.s};--f:${c.f};--a:${c.a};--a2:${c.a2};--fd:${F.d};--fb:${F.b};--fw:${F.dw};--tt:${F.tt};--ls:${F.ls};--r:${c.r||0}em`;
  const title = "Nueva colección";
  let hero = "";
  if(c.hero === "full") hero = `<div class="ms-hero full ms-ph" style="${ph(c,0)}"><div><p class="ms-h">${title}</p><span class="ms-btn">Comprar</span></div></div>`;
  else if(c.hero === "split") hero = `<div class="ms-hero split"><div><p class="ms-h">${title}</p><div class="ms-lines"><i></i><i style="width:70%"></i></div><span class="ms-btn">Comprar</span></div><div class="ms-ph" style="${ph(c,1)}"></div></div>`;
  else if(c.hero === "video") hero = `<div class="ms-hero video ms-ph" style="${ph(c,2)}"><span class="ms-play"><span class="mi">play_arrow</span></span><p class="ms-h">${title}</p></div>`;
  else if(c.hero === "carrusel") hero = `<div class="ms-hero carrusel"><p class="ms-h" style="font-size:2.4em">${title}</p><div class="row">${[0,1,2,3,0].map((k,i)=>`<div class="ms-ph" style="${ph(c,k)}"></div>`).join("")}</div></div>`;
  else hero = `<div class="ms-hero letras"><p class="ms-h">${esc(c.name)}</p><div class="strip">${[0,1,3].map(k=>`<div class="ms-ph" style="${ph(c,k)}"></div>`).join("")}</div></div>`;
  const entry = c.entry === "elegir" ? `<div class="ms-entry">${c.cats.map((n,i)=>`<div class="ms-ph" style="${ph(c,i+1)}"><b>${esc(n)}</b></div>`).join("")}</div>` : "";
  const n = c.grid || 3;
  const cards = Array.from({length:n}, (_,i)=>`<div class="ms-card"><div class="ms-ph" style="${ph(c,i)}"></div><div class="ms-lines"><i></i><i></i></div></div>`).join("");
  return `<div class="ms" style="${vars}">
    <div class="ms-nav"><span class="ms-logo">${esc(c.name)}</span><span class="ms-links"><i></i><i></i><i></i></span><span class="mi">shopping_bag</span></div>
    ${entry}${hero}
    <div class="ms-sec">Novedades</div>
    <div class="ms-grid" style="grid-template-columns:repeat(${n},1fr)">${cards}</div>
    <div class="ms-foot"></div></div>`;
}
function pdpArt(layout){
  const c = previewCfg();
  const vars = `--b:${c.bg};--s:${c.s};--f:${c.f};--a:${c.a};--r:${c.r||0}em`;
  const info = `<div class="info"><b></b><i style="width:40%"></i><div class="sizes"><span></span><span></span><span></span><span></span></div><i></i><i style="width:85%"></i><i style="width:60%"></i><i class="btn"></i></div>`;
  if(layout === "galeria") return `<div class="pdp galeria" style="${vars}"><div class="ph-grid">${[0,1,2,3].map(k=>`<div class="ms-ph" style="${ph(c,k)}"></div>`).join("")}</div>${info}</div>`;
  if(layout === "vertical") return `<div class="pdp vertical" style="${vars}"><div class="ph-col">${[0,1,2].map(k=>`<div class="ms-ph" style="${ph(c,k)}"></div>`).join("")}</div>${info}</div>`;
  return `<div class="pdp miniaturas" style="${vars}"><div class="thumbs">${[0,1,2,3].map(k=>`<div class="ms-ph" style="${ph(c,k)}"></div>`).join("")}</div><div class="ms-ph" style="${ph(c,0)}"></div>${info}</div>`;
}
function moodArt(m){
  const [shape, shc] = m.sh;
  const [smBg, smFg, smFont, smW] = m.sm;
  const border = m.id === "minimal" ? "box-shadow:inset 0 0 0 1px #E2E2E2;" : "";
  return `<div class="mood-art">
    <div class="big" style="background:${m.big};${border}color:${shc}"><div class="shape ${shape}" style="background:${shc}"></div></div>
    <div style="background:${m.pat}"></div>
    <div class="word" style="background:${smBg};color:${smFg};font-family:'${smFont}';font-weight:${smW}">Aa</div>
  </div>`;
}

/* ---------- piezas de UI ---------- */
function tilesIcon(key, list, opts){
  opts = opts || {};
  const multi = !!opts.multi;
  const val = S[key];
  const isOn = id => multi ? val.includes(id) : val === id;
  let h = list.map(o => `<button class="tile icon" data-act="pick" data-key="${key}" data-val="${o.id}" ${multi?`data-multi="1" data-max="${opts.max||99}"`:""} ${pressed(isOn(o.id))}>
     ${o.i ? `<span class="mi" aria-hidden="true">${o.i}</span>` : ""}${o.sym ? `<span class="price">${o.sym}</span>` : ""}<span class="t-name">${esc(T(o))}</span></button>`).join("");
  if(opts.help) h += `<button class="tile help" data-act="pick" data-key="${key}" data-val="${HELP}" ${multi?`data-multi="1"`:""} ${pressed(isOn(HELP))}><span class="t-name">${helpLabel()}</span></button>`;
  return `<div class="grid ${opts.cols||"g3"}">${h}</div>`;
}
function chips(key, list, opts){
  opts = opts || {};
  const val = S[key];
  return `<div class="chips">${list.map(o => `<button class="chip" data-act="pick" data-key="${key}" data-val="${o.id}" data-multi="1" data-max="${opts.max||99}" ${pressed(val.includes(o.id))}>${esc(T(o))}</button>`).join("")}</div>`;
}
function helpTile(key, multi){
  const on = multi ? S[key].includes(HELP) : S[key] === HELP;
  return `<button class="tile help" data-act="pick" data-key="${key}" data-val="${HELP}" ${multi?`data-multi="1"`:""} ${pressed(on)}><span class="mi" aria-hidden="true">handshake</span><span class="t-name">${helpLabel()}</span><span class="t-desc">${L("Lo vemos juntos en la reunión","Обговоримо разом на зустрічі")}</span></button>`;
}

function go(n){

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, val = el.dataset.val;
  if(act === "go"){ go(+el.dataset.to); return; }
  if(act === "lang"){ S.lang = val; save(); render(); return; }
  if(act === "pvtoggle"){ $("pv").classList.toggle("open"); return; }
  if(act === "pick"){
    const key = el.dataset.key;
    if(el.dataset.multi){
      let arr = S[key].slice();
      if(val === HELP){ arr = arr.includes(HELP) ? [] : [HELP]; }
      else {
        arr = arr.filter(x => x !== HELP);
        if(arr.includes(val)) arr = arr.filter(x => x !== val);
        else { const max = +(el.dataset.max || 99); if(arr.length >= max) arr.shift(); arr.push(val); }
      }
      S[key] = arr;
    } else {
      S[key] = S[key] === val ? "" : val;
    }
    if(key === "paleta" && S.paleta) S.colorModo = "paleta";
    save(); keepScroll(render); return;
  }
  if(act === "colormode"){ S.colorModo = val; save(); keepScroll(render); return; }
  if(act === "ref"){
    const r = byId(REFS, val); const idx = S.refs.findIndex(x => normUrl(x.url) === normUrl(r.url));
    let focusI = -1;
    if(idx >= 0){ S.refs.splice(idx,1); while(S.refs.length < 2) S.refs.push({url:"",gusta:"",likes:[]}); }
    else {
      let free = S.refs.findIndex(x => !String(x.url).trim() && !String(x.gusta).trim());
      if(free < 0){ S.refs.push({url:"",gusta:"",likes:[]}); free = S.refs.length-1; }
      S.refs[free].url = r.url; focusI = free;
    }
    save(); keepScroll(render);
    if(focusI >= 0){ const ta = $("rg-"+focusI); if(ta){ ta.scrollIntoView({block:"center"}); ta.focus({preventScroll:true}); } }
    return;
  }
  if(act === "like"){
    const i = +el.dataset.i; const arr = S.refs[i].likes || [];
    S.refs[i].likes = arr.includes(val) ? arr.filter(x=>x!==val) : arr.concat(val);
    save(); keepScroll(render); return;
  }
  if(act === "addref"){ S.refs.push({url:"",gusta:"",likes:[]}); save(); keepScroll(render); const i=$("ru-"+(S.refs.length-1)); if(i) i.focus(); return; }
  if(act === "delref"){ S.refs.splice(+el.dataset.i,1); while(S.refs.length < 2) S.refs.push({url:"",gusta:"",likes:[]}); save(); keepScroll(render); return; }
  if(act === "download"){ downloadSummary(); return; }
  if(act === "addcat"){
    let v = val;
    if(!v){ const inp = $("f-cat"); v = inp ? inp.value.trim() : ""; }
    if(v && !S.categorias.includes(v) && S.categorias.length < 20) S.categorias.push(v.slice(0,40));
    save(); keepScroll(render); const inp2 = $("f-cat"); if(!val && inp2) inp2.focus(); return;
  }
  if(act === "delcat"){ S.categorias = S.categorias.filter(c => c !== val); save(); keepScroll(render); return; }
  if(act === "copy"){ copyAnswers(); return; }
});
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "f-cat"){ e.preventDefault(); const v = e.target.value.trim(); if(v && !S.categorias.includes(v)) { S.categorias.push(v.slice(0,40)); save(); keepScroll(render); const i=$("f-cat"); if(i) i.focus(); } }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.bind){ S[t.dataset.bind] = t.value; save(); if(t.dataset.bind === "tienda") renderPreview(); return; }
  if(t.dataset.red){ S.redes[t.dataset.red] = t.value; save(); return; }
  if(t.dataset.refurl !== undefined || t.dataset.refg !== undefined){
    const i = +(t.dataset.refurl ?? t.dataset.refg);
    if(t.dataset.refurl !== undefined) S.refs[i].url = t.value; else S.refs[i].gusta = t.value;
    save(); updateRefState(i); return;
  }
  if(t.dataset.slider){
    S.sl[t.dataset.slider] = +t.value; save();
    const row = t.closest(".sl"); if(row){ row.children[0].classList.toggle("on", +t.value < 40); row.children[2].classList.toggle("on", +t.value > 60); }
    return;
  }
  if(t.dataset.color){ S.propios[+t.dataset.color] = t.value; save(); renderPreview(); return; }
});

/* ---------- copiar y enviar ---------- */
function copyAnswers(){
  const txt = summaryText();
  const st = $("status"), box = $("copybox");
  const fallback = () => { box.hidden = false; box.value = txt; box.focus(); box.select();
    st.textContent = L("Selecciona todo el texto de abajo, cópialo y pégalo en un correo para nosotros.","Виділіть увесь текст нижче, скопіюйте і вставте в лист для нас."); };
  try{
    navigator.clipboard.writeText(txt).then(()=>{ st.textContent = L("Copiado. Pégalo en un correo para nosotros.","Скопійовано. Вставте в лист для нас."); }, fallback);
  }catch(err){ fallback(); }
}
function updateRefState(i){
  const row = $("refrow-"+i); if(row) row.classList.toggle("ok", validRef(S.refs[i]));
  const c = $("refCount"); if(c){ c.innerHTML = refCountHtml(); c.className = "refcount " + (refsOkCount()>=2 ? "ok" : "no"); }
  const b = $("btnNext"); if(b) b.disabled = refsOkCount() < 2;
  const tile = document.querySelectorAll(".tile.ref");
  tile.forEach(t => { const r = byId(REFS, t.dataset.val); t.setAttribute("aria-pressed", S.refs.some(x=>normUrl(x.url)===normUrl(r.url))); });
}
function downloadSummary(){
  const md = summaryText();
  const name = "adn-marca-" + slug(S.tienda || S.nombre) + "-" + new Date().toISOString().slice(0,10) + ".md";
  const st = $("status");
  try{
    const blob = new Blob(["﻿" + md], {type:"text/markdown;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    st.innerHTML = L(`Descargado: <b>${esc(name)}</b>. Lo tienes en tu carpeta de Descargas. Adjúntalo en un correo y envíanoslo.`,
                     `Завантажено: <b>${esc(name)}</b>. Файл у папці «Завантаження». Прикріпіть його до листа й надішліть нам.`);
  }catch(err){
    st.textContent = L("No se ha podido descargar. Usa «Copiar el texto» y pégalo en un correo.","Не вдалося завантажити. Натисніть «Скопіювати текст» і вставте його в лист.");
  }
}

render();
})();
</script>
